<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Analysis Report</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f0f2f5; margin: 0; padding: 0;
  color: #222; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.card {
  background: #fff; border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
  padding: 36px 40px; min-width: 520px; max-width: 640px;
}
.header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 22px;
}
.back-btn {
  padding: 6px 12px; border-radius: 6px; border: 1px solid #d0d5dd;
  background: #fff; cursor: pointer; font-size: 12px; color: #666;
  text-decoration: none; transition: all .12s;
}
.back-btn:hover { background: #f0f6ff; border-color: #4a90e2; color: #4a90e2; }
.title { font-size: 18px; font-weight: 700; color: #1a1a2e; flex: 1; }
.exit-btn {
  padding: 6px 16px; border-radius: 6px; border: 1px solid #d0d5dd;
  background: #fff; cursor: pointer; font-size: 12px; font-weight: 600;
  color: #555; text-decoration: none; transition: all .12s; white-space: nowrap;
}
.exit-btn:hover { background: #fee2e2; border-color: #dc2626; color: #dc2626; }
.session-id {
  font-family: monospace; font-size: 11px; color: #888;
  margin-bottom: 18px; word-break: break-all;
}
.meta {
  font-size: 12px; color: #555; margin-bottom: 24px;
  padding: 12px 14px; background: #f8f9fb; border-radius: 8px;
  border: 1px solid #e8eaed;
}
.meta-row { display: flex; gap: 10px; margin-bottom: 4px; }
.meta-row:last-child { margin-bottom: 0; }
.meta-label { color: #888; min-width: 90px; font-weight: 500; }
.meta-val { color: #333; }
.badge {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 600;
}
.badge-A { background: #dbeafe; color: #1d4ed8; }
.badge-B { background: #dcfce7; color: #15803d; }
.badge-C { background: #fef9c3; color: #854d0e; }
.badge-D { background: #fce7f3; color: #9d174d; }

.progress-section { margin-top: 20px; }
.progress-label {
  font-size: 13px; font-weight: 600; color: #333; margin-bottom: 10px;
}
.progress-bar {
  height: 14px; background: #e5e7eb; border-radius: 7px;
  overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #4a90e2, #3a7cc5);
  transition: width .4s ease; width: 0%;
}
.progress-fill.pulsing {
  background-image: linear-gradient(90deg, #4a90e2 0%, #6fb0ff 50%, #4a90e2 100%);
  background-size: 200% 100%;
  animation: shimmer 1.6s linear infinite;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.progress-meta {
  font-family: monospace; font-size: 11px; color: #666;
  margin-top: 6px; white-space: pre-wrap;
}

.done-section { display: none; text-align: center; padding: 8px 0; }
.done-section.show { display: block; }
.done-icon { font-size: 42px; color: #16a34a; margin-bottom: 6px; }
.done-msg { font-size: 14px; color: #16a34a; font-weight: 600; }
.done-sub { font-size: 12px; color: #666; margin-top: 4px; }

.error-section { display: none; text-align: center; padding: 8px 0; }
.error-section.show { display: block; }
.error-icon { font-size: 42px; color: #dc2626; margin-bottom: 6px; }
.error-msg { font-size: 14px; color: #dc2626; font-weight: 600; }
.error-detail {
  font-size: 12px; color: #666; margin-top: 8px;
  padding: 10px; background: #fee2e2; border-radius: 6px;
  font-family: monospace; word-break: break-all; text-align: left;
}

.open-btn {
  display: inline-block; margin-top: 16px; padding: 10px 22px;
  background: #4a90e2; color: #fff; border: none; border-radius: 6px;
  font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
}
.open-btn:hover { background: #3a7cc5; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <a class="back-btn" href="/pe/report/">← 목록</a>
    <div class="title">Analysis Report</div>
    <a class="exit-btn" href="/pe/report/">Exit</a>
  </div>

  <div class="session-id" id="sessionIdDisplay"></div>

  <div class="meta" id="metaBox" style="display:none;">
    <div class="meta-row"><span class="meta-label">파일</span><span class="meta-val" id="metaFiles"></span></div>
    <div class="meta-row"><span class="meta-label">Product Type</span><span class="meta-val" id="metaPt"></span></div>
    <div class="meta-row"><span class="meta-label">생성일시</span><span class="meta-val" id="metaDate"></span></div>
    <div class="meta-row"><span class="meta-label">Dataset ID</span><span class="meta-val" id="metaDsId"></span></div>
  </div>

  <div class="progress-section" id="progressSection">
    <div class="progress-label" id="progressLabel">초기화 중...</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-meta" id="progressMeta"></div>
  </div>

  <div class="done-section" id="doneSection">
    <div class="done-icon">✓</div>
    <div class="done-msg">빌드 완료</div>
    <div class="done-sub">잠시 후 Analysis Report로 이동합니다...</div>
    <a class="open-btn" id="openBtn" href="#">지금 열기</a>
  </div>

  <div class="error-section" id="errorSection">
    <div class="error-icon">✕</div>
    <div class="error-msg" id="errorTitle">빌드 실패</div>
    <div class="error-detail" id="errorDetail"></div>
  </div>
</div>

<script>
const SESSION_ID = location.pathname.split("/").pop();
document.getElementById("sessionIdDisplay").textContent = "session_id: " + SESSION_ID;

const STAGE_LABELS = {
  queued: "대기 중", save_inputs: "1/5 CSV 저장", load_csv: "2/5 CSV 파싱",
  table_json: "3/5 테이블 JSON", cdf_svg: "4/5 CDF/SVG 생성",
  write_page: "5/5 HTML 생성", done: "빌드 완료", error: "빌드 에러",
};

let _datasetId = null;
let _completed = false;
let _analysisWaitStart = null;  // 빌드 완료 후 분석 대기 시작 시각

async function poll() {
  try {
    const res = await fetch(`/pe/report/session/${SESSION_ID}/full`, { cache: "no-store" });
    if (!res.ok) {
      if (res.status === 404) {
        showError("세션을 찾을 수 없음", "session_id가 잘못되었거나 DB에서 삭제됨");
        return;
      }
      throw new Error(await res.text());
    }
    const data = await res.json();
    const session = data.session || {};
    _datasetId = session.dataset_id || null;

    // 메타 정보 업데이트
    updateMeta(session);

    // 세션 실패 처리
    if (session.status === "failed") {
      showError("분석 실패", session.error_message || "원인 미상");
      return;
    }

    // dataset_id 없는 순수 report/analyze 세션
    if (!_datasetId) {
      if (session.status === "done" || session.status === "reused") {
        finish();
      } else {
        const lbl = document.getElementById("progressLabel");
        const meta = document.getElementById("progressMeta");
        lbl.textContent = "분석 진행 중";
        meta.textContent = `status: ${session.status || "?"}`;
        document.getElementById("progressFill").style.width = "30%";
      }
      return;
    }

    // build_status 확인 (dataset_id가 있는 execute 세션)
    const buildOk = await checkBuild(_datasetId);
    if (buildOk) {
      if (session.status === "done" || session.status === "reused") {
        finish();
      } else {
        // 빌드는 끝났지만 분석이 아직 진행 중 → 경과 시간 + status 표시
        if (_analysisWaitStart === null) _analysisWaitStart = Date.now();
        const elapsed = Math.round((Date.now() - _analysisWaitStart) / 1000);
        const lbl = document.getElementById("progressLabel");
        const meta = document.getElementById("progressMeta");
        const st = session.status || "?";
        let hint = "";
        if (elapsed > 90) {
          hint = "  ⚠ 평소보다 오래 걸리는 중";
        } else if (elapsed > 45) {
          hint = "  (잠시만 더 기다려주세요)";
        }
        lbl.textContent = `빌드 완료 — 분석 처리 중... (${elapsed}s 경과)${hint}`;
        meta.textContent = `analysis status: ${st} · 보통 5~30초 소요`;
        const pf = document.getElementById("progressFill");
        pf.style.width = "95%";
        pf.classList.add("pulsing");
      }
    }
  } catch (e) {
    console.warn("poll error:", e);
  }
}

async function checkBuild(dsId) {
  const fill = document.getElementById("progressFill");
  const lbl = document.getElementById("progressLabel");
  const meta = document.getElementById("progressMeta");

  try {
    const r = await fetch(`/api/${dsId}/build_status`, { cache: "no-store" });
    if (!r.ok) {
      // 빌드가 아직 시작 안 됨
      lbl.textContent = "빌드 시작 대기";
      fill.style.width = "5%"; meta.textContent = "";
      return false;
    }
    const s = await r.json();

    if (s.stage === "error") {
      showError("빌드 에러", s.error || "원인 미상");
      return false;
    }

    if (s.stage === "done") {
      lbl.textContent = "빌드 완료";
      fill.style.width = "100%";
      meta.textContent = `${s.current}/${s.total} subjects · ${s.elapsed_s}s`;
      return true;
    }

    const stage = STAGE_LABELS[s.stage] || s.stage;
    const pct = s.total > 0 ? Math.round(s.current / s.total * 100) : 5;
    lbl.textContent = stage;
    fill.style.width = pct + "%";
    meta.textContent = `${s.current||0}/${s.total||0} · ${s.elapsed_s||0}s`;
    return false;
  } catch (e) {
    return false;
  }
}

function updateMeta(session) {
  if (!session) return;
  const box = document.getElementById("metaBox");
  if (!session.session_id) return;
  box.style.display = "";
  document.getElementById("metaFiles").textContent = session.file_name || "-";
  const pt = session.product_type || "";
  document.getElementById("metaPt").innerHTML = ["A","B","C","D"].includes(pt)
    ? `<span class="badge badge-${pt}">${pt}</span>` : (pt || "-");
  document.getElementById("metaDate").textContent = session.created_at
    ? new Date(session.created_at * 1000).toLocaleString("ko-KR") : "-";
  document.getElementById("metaDsId").textContent = session.dataset_id || "-";
}

function finish() {
  if (_completed) return;
  _completed = true;
  document.getElementById("progressSection").style.display = "none";
  document.getElementById("doneSection").classList.add("show");
  if (_datasetId) {
    const dashUrl = `/dash/${_datasetId}`;
    document.getElementById("openBtn").href = dashUrl;
    document.querySelector(".done-sub").textContent = "잠시 후 Analysis Report로 이동합니다...";
    setTimeout(() => { location.href = dashUrl; }, 1200);
  } else {
    // dataset_id 없는 순수 분석 완료: 대시보드 없음, 현재 세션 결과만 표시
    const akey = document.getElementById("metaDsId").textContent.trim();
    document.querySelector(".done-sub").textContent = "분석이 완료되었습니다.";
    document.getElementById("openBtn").style.display = "none";
  }
}

function showError(title, detail) {
  _completed = true;
  document.getElementById("progressSection").style.display = "none";
  document.getElementById("doneSection").classList.remove("show");
  document.getElementById("errorSection").classList.add("show");
  document.getElementById("errorTitle").textContent = title;
  document.getElementById("errorDetail").textContent = detail || "";
}

// 초기 + 2.5초 간격 폴링
poll();
const _timer = setInterval(() => {
  if (_completed) { clearInterval(_timer); return; }
  poll();
}, 2500);
</script>
</body>
</html>
